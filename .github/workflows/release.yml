name: Build and release Windows exe

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: pip install --disable-pip-version-check pyinstaller

      - name: Build CLI exe
        run: pyinstaller --onefile --name eternal-solitaire-helper nirmana_helper.py

      - name: Build GUI exe
        run: pyinstaller --onefile --windowed --name eternal-solitaire-helper-gui nirmana_gui.py

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/eternal-solitaire-helper.exe
            dist/eternal-solitaire-helper-gui.exe
          generate_release_notes: true
